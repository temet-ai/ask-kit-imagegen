id = "temet.imagegen"
name = "imagegen"
version = "0.3.0"
min_ask_kit = "0.2.0"
requires = ["codex", "node", "python3"]
platforms = ["linux", "macos"]
says = "maintaining persistent reference libraries and style journals for each interest or project, importing reference images, recording user feedback, exporting style sheets, and using bundled specialist design skills; making and editing raster images (illustrations, icons, photos, hero images, mockups, textures, transparent cutouts) with Codex's built-in image_gen tool, in a long-lived Codex thread (a studio) that keeps its house style and every earlier image, so a follow-up can say \"the last one, but at night\"; and which images were made, from which prompt, where the files are, whether a job is still running, and which studios exist and how to open one in Codex"
keywords = ["reference library", "reference sheet", "style journal", "style sheet", "moodboard", "imagegen", "image_gen", "generate (an? )?images?", "(make|create|draw|render|generate) (me )?(an? )?(image|picture|illustration|icon|logo|hero|banner|thumbnail|sprite|texture|mockup|photo)", "edit (the|this|that|an?) (image|picture|png)", "image studio", "codex image", "gpt-image"]
patterns = ['\b(reference library|reference sheet|style journal|image library|moodboard)\b', '\b(make|create|draw|render|generate|design) (me )?(an? |some |the )?(new )?(image|picture|illustration|icon|hero image|banner|thumbnail|sprite|texture|photo)s?\b', '\bimage ?gen\b', '\bimage studio\b']
route_hint = "making or editing a bitmap image (illustration, icon, photo, banner, texture, cutout) and the images made so far are imagegen; a video or motion graphic is hyperframes; a three.js animation is animator; a diagram or chart drawn as code (SVG, HTML) stays with the caller; judging work against the operator's taste is taste"
cite = "for generated images, the absolute path and job id (img-...); for library work, the area and revision, reference ids or exported sheet paths; imported images need not have a generation job id"
instructions = "instructions.md"
acts = [
  "imagegen.make: a Codex image_gen turn (spends the Codex plan's image quota, writes an image file)",
  "imagegen.edit: a Codex image_gen edit turn (same)",
  "imagegen.start, imagegen.reset: open a studio's Codex thread, or forget it",
  "imagegen.cancel: stop a queued or running job",
  "imagegen.library.createArea, imagegen.library.addReference, imagegen.library.feedback, imagegen.library.setStyle, imagegen.library.note, imagegen.library.sheet: save reference images, user decisions, style guidance and sheet exports; no image quota",
]

[[settings]]
key = "IMAGES_DIR"
about = "the folder images are saved in, one subfolder per studio; a request can also name its own path"
default = "~/Pictures/imagegen"

[[settings]]
key = "CALLER_DIR"
about = "the folder the calling agent works in; relative paths in a request (out, refs, image) start here"
detect = ["pwd"]

[[settings]]
key = "LIBRARY_DIR"
about = "persistent reference areas and journal; defaults to XDG_STATE_HOME/ask-kit-imagegen/library (or ~/.local/state/ask-kit-imagegen/library); retained across studio resets"

[[sources]]
kind = "module"
name = "imagegen"
module = "imagegen.mjs"
api = "api.d.ts"

[[roles]]
name = "maker"
when = "a request to make, edit or redo an image"
patterns = ["^(please )?(make|create|draw|render|generate|design|edit|redo|change|fix)\\b"]
instructions = "roles/maker.md"

[[roles]]
name = "librarian"
when = "maintaining image references, recording style feedback or exporting a reference sheet"
patterns = ["reference library|reference sheet|style journal|style sheet|moodboard|approve.*reference|reject.*reference"]
instructions = "roles/librarian.md"
